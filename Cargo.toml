[package]
name = "sshdt"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "A tiny, faithful, standard SSH server daemon (library + CLI) built on russh."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["ssh", "sshd", "server", "russh", "sftp"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "sshdt"
path = "src/lib.rs"

[[bin]]
name = "sshdt"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "config"]
config = []
# The CLI binary: argh, anyhow, and the tracing subscriber/appender. Implies `config`.
cli = [
    "config",
    "dep:argh",
    "dep:anyhow",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:windows-registry",
    "dep:windows-result",
    "dep:windows-sys",
    "dep:fs4",
    "dep:serde",
    "dep:serde_json",
    "dep:tempfile",
    "dep:rand",
    "dep:libc",
    "dep:process-wrap",
    "dep:time",
]

[dependencies]
# --- SSH engine (ADR 0001) ---
russh = "0.63"
russh-sftp = "2.4"

# --- async runtime (public contract; ADR 0010) ---
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "io-std",
    "process",
    "sync",
    "macros",
    "time",
    "fs",
    "signal",
] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"

# --- PTY (ADR 0006/0009): same crate rmux uses; ConPTY on Windows ---
rmux-pty = "0.10"

# --- observability: lib only emits events (ADR 0003) ---
tracing = "0.1"

# --- errors: thiserror in lib (ADR 0008) ---
thiserror = "2"

# --- dirs for ~/.sshdt resolution ---
dirs = "7"

# --- optional: CLI binary deps (feature `cli`) ---
serde = { version = "1", features = ["derive"], optional = true }
process-wrap = { version = "10", features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"], optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }
fs4 = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
rand = { version = "0.10", optional = true }

libc = { version = "0.2", optional = true }

argh = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
], optional = true }
tracing-appender = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-registry = { version = "0.100", optional = true }
windows-result = { version = "0.100", optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Console",
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
futures-util = "0.3"

[profile.release]
strip = true
